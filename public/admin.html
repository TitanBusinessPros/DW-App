<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Wooflahoma Walks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-badge">🐾</span>
      <span class="logo-text">Wooflahoma Walks</span>
    </a>
    <div class="header-actions">
      <button id="logoutBtn" class="btn btn-ghost" style="display:none;">Log out</button>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card" id="gateCard">
    <h1>Admin portal</h1>
    <p class="auth-subtitle">Sign in with an authorized Google account.</p>
    <div id="formError" class="form-error"></div>
    <button id="googleBtn" class="btn btn-google btn-block">
      <span>🔵</span> Continue with Google
    </button>
  </div>

  <div class="auth-card" id="mainCard" style="display:none; max-width: 900px;">
    <h1>Pending approvals</h1>
    <p class="auth-subtitle">New sign-ups sit here until approved or rejected — nothing auto-approves.</p>
    <div id="listArea"><p>Loading…</p></div>
  </div>
</main>

<script type="module">
  import {
    auth, db, functions,
    onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup,
    doc, getDoc, updateDoc, collection, getDocs, query, where, serverTimestamp,
    httpsCallable,
  } from "./firebase-init.js";

  const gateCard = document.getElementById("gateCard");
  const mainCard = document.getElementById("mainCard");
  const errorBox = document.getElementById("formError");
  const logoutBtn = document.getElementById("logoutBtn");

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("visible");
  }
  function clearError() {
    errorBox.classList.remove("visible");
  }

  logoutBtn.addEventListener("click", async () => {
    await signOut(auth);
    location.href = "index.html";
  });

  document.getElementById("googleBtn").addEventListener("click", async () => {
    clearError();
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (err) {
      showError("Google sign-in didn't complete. Try again.");
    }
  });

  function pinGateHtml() {
    return `
      <h1>Enter admin code</h1>
      <p class="auth-subtitle">One more step — this device/browser hasn't verified it yet this session.</p>
      <div id="pinError" class="form-error"></div>
      <form id="pinForm">
        <div class="form-group">
          <label for="pinInput">Admin code</label>
          <input type="password" id="pinInput" required autocomplete="off" inputmode="numeric">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Unlock</button>
      </form>
    `;
  }

  async function verifyPin(uid) {
    gateCard.innerHTML = pinGateHtml();
    gateCard.style.display = "block";
    mainCard.style.display = "none";

    document.getElementById("pinForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pinErrorBox = document.getElementById("pinError");
      pinErrorBox.classList.remove("visible");
      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Checking…";
      try {
        const verifyAdminPin = httpsCallable(functions, "verifyAdminPin");
        const pin = document.getElementById("pinInput").value.trim();
        await verifyAdminPin({ pin });
        sessionStorage.setItem("adminPinVerified:" + uid, "1");
        await showPendingList();
      } catch (err) {
        pinErrorBox.textContent = err?.message || "Incorrect code.";
        pinErrorBox.classList.add("visible");
        submitBtn.disabled = false;
        submitBtn.textContent = "Unlock";
      }
    });
  }

  function roleLabel(role) {
    return { owner: "Dog Owner", walker: "Dog Walker", both: "Dog Owner & Walker" }[role] || role;
  }

  async function showPendingList() {
    gateCard.style.display = "none";
    mainCard.style.display = "block";
    const listArea = document.getElementById("listArea");
    listArea.innerHTML = "<p>Loading…</p>";

    const snap = await getDocs(query(collection(db, "users"), where("approved", "==", false)));
    const pending = [];
    snap.forEach((d) => {
      const data = d.data();
      if (data.rejected) return; // already handled, don't resurface
      pending.push({ id: d.id, ...data });
    });
    pending.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

    if (pending.length === 0) {
      listArea.innerHTML = "<p>Nothing pending — you're caught up. 🎉</p>";
      return;
    }

    listArea.innerHTML = `
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse: collapse;">
          <thead>
            <tr style="text-align:left; border-bottom: 2px solid var(--sage-200);">
              <th style="padding:8px;">Name</th>
              <th style="padding:8px;">Role</th>
              <th style="padding:8px;">Town</th>
              <th style="padding:8px;">Signed up</th>
              <th style="padding:8px;"></th>
            </tr>
          </thead>
          <tbody>
            ${pending.map((p) => `
              <tr id="row-${p.id}" style="border-bottom: 1px solid var(--sage-100);">
                <td style="padding:8px;">${p.displayName || "(no name)"}</td>
                <td style="padding:8px;">${roleLabel(p.role)}</td>
                <td style="padding:8px;">${p.townId || "—"}</td>
                <td style="padding:8px;">${p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString() : "—"}</td>
                <td style="padding:8px; white-space:nowrap;">
                  <button class="btn btn-primary" data-approve="${p.id}" style="padding:6px 14px;">Approve</button>
                  <button class="btn btn-ghost" data-reject="${p.id}" style="padding:6px 14px;">Reject</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    `;

    listArea.querySelectorAll("[data-approve]").forEach((btn) => {
      btn.addEventListener("click", () => actOnUser(btn.dataset.approve, "approve"));
    });
    listArea.querySelectorAll("[data-reject]").forEach((btn) => {
      btn.addEventListener("click", () => actOnUser(btn.dataset.reject, "reject"));
    });
  }

  async function actOnUser(uid, action) {
    const row = document.getElementById("row-" + uid);
    row.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      if (action === "approve") {
        await updateDoc(doc(db, "users", uid), {
          approved: true,
          everApproved: true,
          lastEditedAt: serverTimestamp(),
        });
      } else {
        await updateDoc(doc(db, "users", uid), {
          approved: false,
          rejected: true,
          lastEditedAt: serverTimestamp(),
        });
      }
      row.remove();
    } catch (err) {
      row.querySelectorAll("button").forEach((b) => (b.disabled = false));
      alert("That didn't go through: " + (err?.message || err));
    }
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      gateCard.innerHTML = `
        <h1>Admin portal</h1>
        <p class="auth-subtitle">Sign in with an authorized Google account.</p>
        <div id="formError" class="form-error"></div>
        <button id="googleBtn" class="btn btn-google btn-block">
          <span>🔵</span> Continue with Google
        </button>
      `;
      document.getElementById("googleBtn").addEventListener("click", async () => {
        try {
          await signInWithPopup(auth, new GoogleAuthProvider());
        } catch {
          document.getElementById("formError").textContent = "Google sign-in didn't complete. Try again.";
          document.getElementById("formError").classList.add("visible");
        }
      });
      gateCard.style.display = "block";
      mainCard.style.display = "none";
      logoutBtn.style.display = "none";
      return;
    }

    logoutBtn.style.display = "inline-block";

    if (!user.email) {
      gateCard.innerHTML = `<h1>Not authorized</h1><p>This account has no email — can't check the admin allowlist.</p>`;
      gateCard.style.display = "block";
      mainCard.style.display = "none";
      return;
    }

    const adminSnap = await getDoc(doc(db, "admins", user.email));
    if (!adminSnap.exists()) {
      gateCard.innerHTML = `<h1>Not authorized</h1><p>${user.email} isn't on the admin list.</p>`;
      gateCard.style.display = "block";
      mainCard.style.display = "none";
      return;
    }

    if (sessionStorage.getItem("adminPinVerified:" + user.uid) === "1") {
      await showPendingList();
    } else {
      await verifyPin(user.uid);
    }
  });
</script>

</body>
</html>
