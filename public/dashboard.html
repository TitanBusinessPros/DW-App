<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Wooflahoma Walks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="dev-banner">🚧 In development — this is a placeholder dashboard. Browsing walkers, messaging, and bookings aren't built yet.</div>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-badge">🐾</span>
      <span class="logo-text">Wooflahoma Walks</span>
    </a>
    <div class="header-actions">
      <button id="logoutBtn" class="btn btn-ghost">Log out</button>
    </div>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card" style="max-width: 560px;" id="dashboardCard">
    <p>Loading your profile…</p>
  </div>
</main>

<!-- No admin markup anywhere in this static HTML on purpose — see the
     module script below. It only gets created (via document.createElement)
     and inserted into the page for a user who is (a) actually signed in
     through the normal login flow and (b) on the admins/{email} allowlist.
     For everyone else — logged out or a regular user — nothing admin-
     related is ever added to the DOM; there's nothing to inspect, no link
     to find, no element sitting there hidden with CSS. -->

<script type="module">
  import {
    auth, db, functions,
    onAuthStateChanged, signOut, doc, getDoc, updateDoc,
    collection, getDocs, query, where, serverTimestamp, httpsCallable,
  } from "./firebase-init.js";

  const card = document.getElementById("dashboardCard");

  // onAuthStateChanged can fire more than once for the same sign-in (e.g. a
  // token refresh). Without this guard, a second firing mid-PIN-entry
  // would call mountAdminSection() again, appending a second, independent
  // #adminSection and orphaning whichever one the in-flight submit handler
  // was actually updating.
  let lastHandledUid = null;
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      lastHandledUid = null;
      location.href = "login.html";
      return;
    }
    if (user.uid === lastHandledUid) return;
    lastHandledUid = user.uid;

    const snap = await getDoc(doc(db, "users", user.uid));
    if (!snap.exists()) {
      card.innerHTML = `<h1>Welcome!</h1><p>We couldn't find a profile for your account yet. Try signing up again.</p>`;
    } else {
      const profile = snap.data();
      const statusBadge = profile.approved
        ? `<span class="status-badge status-badge--approved">✅ Approved</span>`
        : `<span class="status-badge status-badge--pending">⏳ Pending review</span>`;
      const roleLabel = { owner: "Dog Owner", walker: "Dog Walker", both: "Dog Owner & Walker" }[profile.role] || profile.role;

      card.innerHTML = `
        <h1>Hey, ${profile.displayName || user.email}! 👋</h1>
        <p class="auth-subtitle">${roleLabel}</p>
        <div style="text-align:center; margin-bottom: 24px;">${statusBadge}</div>
        <p style="text-align:center;">
          ${profile.approved
            ? "Your profile is approved! Browsing walkers and booking isn't built yet, but it's next."
            : "Your profile is waiting on admin review. We'll notify you once it's approved — this app doesn't auto-approve yet."}
        </p>
      `;
    }

    // Real auth check via Firestore rules (isSignedIn() && token.email ==
    // the doc id) — this is what actually decides whether the section
    // below gets created at all, not anything client-side.
    if (user.email) {
      const adminSnap = await getDoc(doc(db, "admins", user.email));
      if (adminSnap.exists()) {
        mountAdminSection(user.uid);
      }
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    location.href = "index.html";
  });

  // Everything below only ever runs for a confirmed admin — it builds the
  // whole section from scratch and appends it, rather than un-hiding
  // something that was already sitting in the page.
  function mountAdminSection(uid) {
    const section = document.createElement("section");
    section.id = "adminSection";
    section.className = "auth-page";
    section.style.paddingTop = "0";
    section.innerHTML = `
      <div class="auth-card" id="gateCard" style="max-width:900px; margin:24px auto 0;"></div>
      <div class="auth-card" id="mainCard" style="display:none; max-width:900px; margin:24px auto 0;">
        <h1>Pending approvals</h1>
        <p class="auth-subtitle">New sign-ups sit here until approved or rejected — nothing auto-approves.</p>
        <div id="listArea"><p>Loading…</p></div>
      </div>
    `;
    document.body.appendChild(section);

    const gateCard = section.querySelector("#gateCard");
    const mainCard = section.querySelector("#mainCard");

    function pinGateHtml() {
      return `
        <h1>Admin code</h1>
        <p class="auth-subtitle">One more step to open the approvals panel.</p>
        <div id="pinError" class="form-error"></div>
        <form id="pinForm">
          <div class="form-group">
            <label for="pinInput">Admin code</label>
            <input type="password" id="pinInput" required autocomplete="off" inputmode="numeric">
          </div>
          <button type="submit" class="btn btn-primary btn-block">Unlock</button>
        </form>
      `;
    }

    function attachPinForm() {
      gateCard.innerHTML = pinGateHtml();
      gateCard.style.display = "block";
      mainCard.style.display = "none";

      gateCard.querySelector("#pinForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pinErrorBox = gateCard.querySelector("#pinError");
        pinErrorBox.classList.remove("visible");
        const submitBtn = e.target.querySelector("button[type=submit]");
        submitBtn.disabled = true;
        submitBtn.textContent = "Checking…";
        try {
          const verifyAdminPin = httpsCallable(functions, "verifyAdminPin");
          const pin = gateCard.querySelector("#pinInput").value.trim();
          await verifyAdminPin({ pin });
          sessionStorage.setItem("adminPinVerified:" + uid, "1");
          await showPendingList();
        } catch (err) {
          pinErrorBox.textContent = err?.message || "Incorrect code.";
          pinErrorBox.classList.add("visible");
          submitBtn.disabled = false;
          submitBtn.textContent = "Unlock";
        }
      });
    }

    function roleLabel(role) {
      return { owner: "Dog Owner", walker: "Dog Walker", both: "Dog Owner & Walker" }[role] || role;
    }

    async function showPendingList() {
      gateCard.style.display = "none";
      mainCard.style.display = "block";
      const listArea = mainCard.querySelector("#listArea");
      listArea.innerHTML = "<p>Loading…</p>";

      const snap = await getDocs(query(collection(db, "users"), where("approved", "==", false)));
      const pending = [];
      snap.forEach((d) => {
        const data = d.data();
        if (data.rejected) return;
        pending.push({ id: d.id, ...data });
      });
      pending.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));

      if (pending.length === 0) {
        listArea.innerHTML = "<p>Nothing pending — you're caught up. 🎉</p>";
        return;
      }

      listArea.innerHTML = `
        <div style="overflow-x:auto;">
          <table style="width:100%; border-collapse: collapse;">
            <thead>
              <tr style="text-align:left; border-bottom: 2px solid var(--sage-200);">
                <th style="padding:8px;">Name</th>
                <th style="padding:8px;">Role</th>
                <th style="padding:8px;">Town</th>
                <th style="padding:8px;">Signed up</th>
                <th style="padding:8px;"></th>
              </tr>
            </thead>
            <tbody>
              ${pending.map((p) => `
                <tr id="row-${p.id}" style="border-bottom: 1px solid var(--sage-100);">
                  <td style="padding:8px;">${p.displayName || "(no name)"}</td>
                  <td style="padding:8px;">${roleLabel(p.role)}</td>
                  <td style="padding:8px;">${p.townId || "—"}</td>
                  <td style="padding:8px;">${p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString() : "—"}</td>
                  <td style="padding:8px; white-space:nowrap;">
                    <button class="btn btn-primary" data-approve="${p.id}" style="padding:6px 14px;">Approve</button>
                    <button class="btn btn-ghost" data-reject="${p.id}" style="padding:6px 14px;">Reject</button>
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;

      listArea.querySelectorAll("[data-approve]").forEach((btn) => {
        btn.addEventListener("click", () => actOnUser(btn.dataset.approve, "approve"));
      });
      listArea.querySelectorAll("[data-reject]").forEach((btn) => {
        btn.addEventListener("click", () => actOnUser(btn.dataset.reject, "reject"));
      });
    }

    async function actOnUser(targetUid, action) {
      const row = mainCard.querySelector("#row-" + targetUid);
      row.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        await updateDoc(doc(db, "users", targetUid),
          action === "approve"
            ? { approved: true, everApproved: true, lastEditedAt: serverTimestamp() }
            : { approved: false, rejected: true, lastEditedAt: serverTimestamp() }
        );
        row.remove();
      } catch (err) {
        row.querySelectorAll("button").forEach((b) => (b.disabled = false));
        alert("That didn't go through: " + (err?.message || err));
      }
    }

    if (sessionStorage.getItem("adminPinVerified:" + uid) === "1") {
      showPendingList();
    } else {
      attachPinForm();
    }
  }
</script>

</body>
</html>
