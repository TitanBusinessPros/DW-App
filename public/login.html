<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Wooflahoma Walks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">
      <span class="logo-badge">🐾</span>
      <span class="logo-text">Wooflahoma Walks</span>
    </a>
  </div>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to message walkers, manage bookings, and more.</p>

    <div id="formError" class="form-error"></div>

    <!-- Google Sign-In only — no email/password account is ever created,
         so there's nothing for an email/password form here to log into. -->
    <button id="googleBtn" class="btn btn-google btn-block">
      <span>🔵</span> Continue with Google
    </button>

    <p class="auth-footer-link">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</main>

<script type="module">
  import {
    auth, db,
    onAuthStateChanged, signInWithPopup, GoogleAuthProvider,
    doc, getDoc,
  } from "./firebase-init.js";

  const errorBox = document.getElementById("formError");
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add("visible");
  }

  function friendlyAuthError(err) {
    const code = err?.code || "";
    if (code.includes("popup-closed-by-user")) return "Google sign-in was closed before finishing.";
    return "Couldn't log you in. Please try again.";
  }

  async function hasCompleteProfile(uid) {
    const snap = await getDoc(doc(db, "users", uid));
    return snap.exists() && !!snap.data()?.profile?.name;
  }

  // Routes to dashboard.html normally, but to signup.html if this account
  // authenticated with Google before but never finished the terms/profile
  // steps (e.g. closed the tab mid-onboarding) — signup.html resumes
  // exactly where they left off rather than making them start over.
  async function routeSignedInUser(uid) {
    location.href = (await hasCompleteProfile(uid)) ? "dashboard.html" : "signup.html";
  }

  document.getElementById("googleBtn").addEventListener("click", async () => {
    try {
      const cred = await signInWithPopup(auth, new GoogleAuthProvider());
      await routeSignedInUser(cred.user.uid);
    } catch (err) {
      showError(friendlyAuthError(err));
    }
  });

  // Already logged in? Route appropriately. Unsubscribe after the first
  // callback so this doesn't also fire (and race) when our own
  // signInWithPopup call above signs someone in.
  const unsubscribe = onAuthStateChanged(auth, (user) => {
    unsubscribe();
    if (user) routeSignedInUser(user.uid);
  });
</script>

</body>
</html>
