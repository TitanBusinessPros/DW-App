name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Firestore/Storage emulators run on the JVM — firebase-tools requires
      # Java 21+, which ubuntu-latest's default `java` doesn't satisfy.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install test dependencies
        working-directory: testing
        run: npm install

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      # Fails fast (no emulator needed) if functions/index.js exports a
      # Cloud Function with no matching test under testing/functions/ —
      # see that script's header comment for what it does and doesn't catch.
      - name: Check every Cloud Function has a matching test
        run: node testing/functions/check-function-coverage.js

      - name: Install Playwright browsers
        working-directory: testing
        run: npx playwright install --with-deps chromium

      # Fixed, non-secret placeholder — never the real production ADMIN_PIN
      # (that only ever lives in Secret Manager, set by hand — see
      # docs/ARCHITECTURE.md). Matches testing/functions/run-admin-pin-tests.js.
      - name: Write local test secret for the functions emulator
        run: echo "ADMIN_PIN=00000000-local-test-only" > functions/.secret.local

      # Fails fast (no emulator needed) if firestore.rules has a collection
      # with no matching test under testing/rules/ — see that script's header
      # comment for what it does and doesn't catch.
      - name: Check every Firestore collection has a matching test
        run: node testing/rules/check-rules-coverage.js

      - name: Firestore & Storage rules tests
        working-directory: testing
        run: |
          firebase emulators:exec \
            --project dog-walker-rules-test \
            --only firestore \
            "npm run test:rules"

      - name: verifyAdminPin Cloud Function tests
        run: |
          firebase emulators:exec \
            --project dw-app-2beee \
            --only auth,firestore,functions \
            "node testing/functions/run-admin-pin-tests.js"

      # No Auth/Functions emulator needed — sendPushToUser/logInAppNotification
      # are plain helper functions (unit-tested by requiring functions/index.js
      # directly, see that test file's header), not an HTTP-reachable function.
      - name: Notification plumbing tests
        run: |
          firebase emulators:exec \
            --project dw-app-2beee \
            --only firestore \
            "node testing/functions/run-notification-plumbing-tests.js"

      - name: onNewSignup / onProfileSubmitted Cloud Function tests
        run: |
          firebase emulators:exec \
            --project dw-app-2beee \
            --only auth,firestore,functions \
            "node testing/functions/run-signup-notify-tests.js"

      - name: End-to-end tests (Playwright, against emulators)
        run: |
          firebase emulators:exec \
            --project dw-app-2beee \
            --only firestore,hosting,auth,storage,functions \
            "npm --prefix testing test"
