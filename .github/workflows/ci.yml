name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The Firestore/Storage emulators run on the JVM — firebase-tools requires
      # Java 21+, which ubuntu-latest's default `java` doesn't satisfy.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Install test dependencies
        working-directory: testing
        run: npm install

      - name: Install Playwright browsers
        working-directory: testing
        run: npx playwright install --with-deps chromium

      - name: Firestore & Storage rules tests
        working-directory: testing
        run: |
          firebase emulators:exec \
            --project dog-walker-rules-test \
            --only firestore \
            "npm run test:rules"

      - name: End-to-end tests (Playwright, against emulators)
        run: |
          firebase emulators:exec \
            --project dog-walker-e2e-test \
            --only firestore,hosting,auth,storage \
            "npm --prefix testing test"
